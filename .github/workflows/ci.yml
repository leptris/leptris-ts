name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Engine sources (pinned release)
        run: git clone --depth 1 --branch "v${ENGINE_VERSION}" https://github.com/leptris/leptris.git leptris
        env:
          ENGINE_VERSION: "1.9.355"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Build (zero-warning gate)
        run: |
          ENGINESRC=$GITHUB_WORKSPACE/leptris/src ./build.sh 2>&1 | tee build.log
          # The wasm32 build is the only lane that compiles the
          # engine with 32-bit size_t/uintptr_t — warnings there are
          # real portability bugs (truncated 64-bit constants, UB
          # shifts), not noise. The gate stays zero-tolerance.
          ! grep -q "warning:" build.log || {
            echo "::error::emcc emitted warnings — wasm32 portability class, fix in leptris/leptris"
            exit 1
          }
      - name: Test
        run: node --test test/test.mjs
