name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One publish at a time; an already-published version is skipped by
# the guard below, so a duplicate dispatch is a no-op instead of an
# E409 failure.
concurrency:
  group: npm-publish
  cancel-in-progress: false

# npm trusted publishing: the workflow authenticates via the OIDC
# id-token (no NPM_TOKEN secret). The package's publisher settings on
# npmjs.com must register exactly:
#   owner/repository: leptris/leptris-ts   workflow: publish.yml
# (no environment claim — the repo's protection rules gate the
# workflow; provenance rides the same id-token).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10.x; trusted publishing needs npm >= 11.5.1.
      - name: npm CLI for trusted publishing
        run: npm install -g npm@^11
      - name: Engine sources (pinned release)
        run: git clone --depth 1 --branch "v${ENGINE_VERSION}" https://github.com/leptris/leptris.git leptris
        env:
          ENGINE_VERSION: "1.9.376"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Build
        run: ENGINESRC=$GITHUB_WORKSPACE/leptris/src ./build.sh
      - name: Test
        run: node --test test/test.mjs
      - name: Skip if already published
        id: published
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "leptris@$v" version >/dev/null 2>&1; then
            echo "leptris@$v is already on npm — nothing to publish"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.published.outputs.skip != '1'
        run: npm publish --provenance --access public
