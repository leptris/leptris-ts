name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# npm trusted publishing: the workflow authenticates via the OIDC
# id-token (no NPM_TOKEN secret). The package's publisher settings on
# npmjs.com must register exactly:
#   owner/repository: leptris/leptris-ts   workflow: publish.yml
#   environment: npm
# Provenance rides the same id-token.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10.x; trusted publishing needs npm >= 11.5.1.
      - name: npm CLI for trusted publishing
        run: npm install -g npm@^11
      - name: Engine sources (pinned release)
        run: git clone --depth 1 --branch "v${ENGINE_VERSION}" https://github.com/leptris/leptris.git leptris
        env:
          ENGINE_VERSION: "1.9.354"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Build
        run: ENGINESRC=$GITHUB_WORKSPACE/leptris/src ./build.sh
      - name: Test
        run: node --test test/test.mjs
      - name: Publish
        run: npm publish --provenance --access public
